stages:
  - build
  - test

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build-windows:
  stage: build
  tags:
    - os/win11
  rules:
    - if: '$ENABLE_JOBS =~ /build-windows/'
  parallel:
    matrix:
      - BUILD_TYPE: ['Release', 'Debug']
        DX12: 'ON'
        VULKAN: 'OFF'
      # Vulkan is at feature parity, so it is built and gated, not advisory.
      - BUILD_TYPE: ['Release']
        DX12: 'ON'
        VULKAN: 'ON'
  script:
    - internal/tools/set_vs_vars.ps1
    - mkdir build
    - cd build
    - cmake .. -G "Visual Studio 17 2022" -A x64 "-DCMAKE_BUILD_TYPE=$BUILD_TYPE" "-DDONUT_WITH_DX12=$DX12" "-DDONUT_WITH_VULKAN=$VULKAN"
    - cmake --build . --config "$BUILD_TYPE" --target package

  artifacts:
    when: on_success
    access: all
    expire_in: 30 days
    paths: ['build/rtxmg.*.zip']

# Tiers 1-2: smoke plus the golden counters and images.  Needs a GPU runner --
# every scenario renders.  run.py takes a machine-wide lock, so two concurrent
# pipelines on one runner serialize instead of corrupting each other's results.
test-windows:
  stage: test
  tags:
    - os/win11
    - gpu/nvidia
  rules:
    - if: '$ENABLE_JOBS =~ /test-windows/'
  needs: ['build-windows']
  script:
    - internal/tools/set_vs_vars.ps1
    - mkdir build
    - cd build
    - cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDONUT_WITH_DX12=ON -DDONUT_WITH_VULKAN=OFF
    - cmake --build . --config RelWithDebInfo --target rtxmg_demo
    - cd ../internal/tests
    - python run.py --tier 1,2 --out report.json

  artifacts:
    when: always
    access: all
    expire_in: 30 days
    paths:
      - 'internal/tests/report.json'
      # The diff images, which are the only actionable part of an image failure.
      - 'internal/tests/_work/**/diff.*.png'
      - 'internal/tests/_work/**/run.log'
